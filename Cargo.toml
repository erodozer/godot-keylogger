[package]
name = "gd-keylogger"
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/erodozer/godot-keylogger"
readme = "README.md"

[lib]
crate-type = ["cdylib"]

[dependencies]
godot = { version = "0.5.4", features = ["upcoming-editor-placeholders"] }
libc = "0.2.189"

[target.x86_64-unknown-linux-gnu.dependencies]
evdev = "0.13.2"
input = "0.10.0"

[profile.dev.package."*"]
opt-level = 3
